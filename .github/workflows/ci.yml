name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Biome config
        run: npm test

      - name: Validate release-it config
        run: node -e "JSON.parse(require('node:fs').readFileSync('.release-it.json', 'utf8'))"

      - name: Validate package contents
        run: npm pack --dry-run
